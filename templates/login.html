{% extends "base.html" %}
{% block title %}Admin Login - Emotion Analysis System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-4 col-lg-5 col-md-7 col-sm-9">
        <div class="text-center mb-4 animate-pop-in">
            <i class="fa-solid fa-user-shield text-primary fs-1 mb-3 animate-float"></i>
            <h2 class="fw-bold text-uppercase tracking-wider">Admin Portal</h2>
            <p class="text-muted">Sign in to view log history & statistics dashboard</p>
        </div>
        <div class="card glass-card shadow p-4 animate-pop-in">
            <div class="card-body">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label"><i class="fas fa-user text-primary me-2"></i>Username</label>
                        <input type="text" class="form-control p-2.5" id="username" name="username" placeholder="Enter username (e.g. admin)" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="fas fa-lock text-primary me-2"></i>Password</label>
                        <input type="password" class="form-control p-2.5" id="password" name="password" placeholder="Enter password (e.g. admin123)" required autocomplete="current-password">
                    </div>
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary rounded-pill py-2.5 shadow"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
